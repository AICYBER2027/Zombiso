[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vicepulse"
version = "0.1.0"
description = "VicePulse short-form GTA media pipeline (EN + BR). Local, offline-testable; nothing here deploys or publishes by itself."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "psycopg[binary]>=3.1",
  "requests>=2.31",
  "pillow>=10",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
test = ["pytest>=8"]

[project.scripts]
vicepulse = "vicepulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
